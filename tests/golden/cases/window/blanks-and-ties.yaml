id: blanks-and-ties
description: >-
  Where BLANK goes in ORDERBY: by default it is the smallest value (first ascending, last descending);
  FIRST and LAST put it first or last whatever the direction. RANK with SKIP and DENSE ties. The current
  row comes from ADDCOLUMNS' row context.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  S = Sales
  r = ALL(S["SaleID"], S["Qty"], S["Note"])
  by_qty = (S["Qty"], ASC, S["SaleID"], ASC)
  by_qty_desc = (S["Qty"], DESC, S["SaleID"], ASC)
  result = model.evaluate(ADDCOLUMNS(r, {
      "AscDef": ROWNUMBER(r, ORDERBY(*by_qty)),
      "DescDef": ROWNUMBER(r, ORDERBY(*by_qty_desc)),
      "AscFirst": ROWNUMBER(r, ORDERBY(*by_qty), FIRST),
      "DescFirst": ROWNUMBER(r, ORDERBY(*by_qty_desc), FIRST),
      "AscLast": ROWNUMBER(r, ORDERBY(*by_qty), LAST),
      "DescLast": ROWNUMBER(r, ORDERBY(*by_qty_desc), LAST),
      "NAsc": ROWNUMBER(r, ORDERBY(S["Note"], ASC)),
      "NDesc": ROWNUMBER(r, ORDERBY(S["Note"], DESC)),
      "NLast": ROWNUMBER(r, ORDERBY(S["Note"], ASC), LAST),
      "RankQ": RANK(DENSE, r, ORDERBY(S["Qty"], DESC)),
      "RankQSkip": RANK(SKIP, r, ORDERBY(S["Qty"], ASC)),
  }))
dax: |
  EVALUATE
      ADDCOLUMNS(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), "AscDef", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Qty], ASC, Sales[SaleID], ASC)), "DescDef", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Qty], DESC, Sales[SaleID], ASC)), "AscFirst", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Qty], ASC, Sales[SaleID], ASC), FIRST), "DescFirst", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Qty], DESC, Sales[SaleID], ASC), FIRST), "AscLast", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Qty], ASC, Sales[SaleID], ASC), LAST), "DescLast", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Qty], DESC, Sales[SaleID], ASC), LAST), "NAsc", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Note], ASC)), "NDesc", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Note], DESC)), "NLast", ROWNUMBER(ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Note], ASC), LAST), "RankQ", RANK(DENSE, ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Qty], DESC)), "RankQSkip", RANK(SKIP, ALL(Sales[SaleID], Sales[Qty], Sales[Note]), ORDERBY(Sales[Qty], ASC)))
expected:
  ordered: false
  columns:
    Sales[SaleID]: integer
    Sales[Qty]: integer
    Sales[Note]: string
    '[AscDef]': integer
    '[DescDef]': integer
    '[AscFirst]': integer
    '[DescFirst]': integer
    '[AscLast]': integer
    '[DescLast]': integer
    '[NAsc]': integer
    '[NDesc]': integer
    '[NLast]': integer
    '[RankQ]': integer
    '[RankQSkip]': integer
  rows:
  - [3, null, null, 1, 5, 1, 1, 5, 5, 1, 5, 5, 4, 1]
  - [1, 1, a, 2, 3, 2, 4, 1, 3, 2, 4, 1, 3, 2]
  - [2, 2, x, 4, 2, 4, 3, 3, 2, 5, 1, 4, 2, 4]
  - [4, 4, b, 5, 1, 5, 2, 4, 1, 3, 3, 2, 1, 5]
  - [5, 1, c, 3, 4, 3, 5, 2, 4, 4, 2, 3, 3, 2]

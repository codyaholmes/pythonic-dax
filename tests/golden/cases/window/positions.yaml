id: positions
description: >-
  With no filter every row is current, so OFFSET(1) returns 3 rows. INDEX(-1) counts from the end, INDEX
  past the end is empty, and WINDOW(2, ABS, -1, ABS) runs from the second row to the last.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  N = Customer["Name"]
  result = model.evaluate(ROW(
      "NoCtx", COUNTROWS(OFFSET(1, ALL(N), ORDERBY(N))),
      "Idx", COUNTROWS(INDEX(-1, ALL(N), ORDERBY(N))),
      "IdxOut", COUNTROWS(INDEX(9, ALL(N), ORDERBY(N))),
      "Win", COUNTROWS(WINDOW(2, ABS, -1, ABS, ALL(N), ORDERBY(N))),
  ))
dax: |
  EVALUATE
      ROW("NoCtx", COUNTROWS(OFFSET(1, ALL(Customer[Name]), ORDERBY(Customer[Name]))), "Idx", COUNTROWS(INDEX(-1, ALL(Customer[Name]), ORDERBY(Customer[Name]))), "IdxOut", COUNTROWS(INDEX(9, ALL(Customer[Name]), ORDERBY(Customer[Name]))), "Win", COUNTROWS(WINDOW(2, ABS, -1, ABS, ALL(Customer[Name]), ORDERBY(Customer[Name]))))
expected:
  ordered: false
  columns:
    '[NoCtx]': integer
    '[Idx]': integer
    '[IdxOut]': integer
    '[Win]': integer
  rows:
  - [3, 1, null, 3]

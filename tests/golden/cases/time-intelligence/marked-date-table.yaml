python: |
  d = Cal["Date"]
  rows = COUNTROWS(Cal)
  result = model.evaluate(ROW({
      "Rows": rows,
      "Boolean": CALCULATE(CALCULATE(rows, d <= DATE(2024, 1, 10)), Cal["Month"] == "2024-02"),
      "Keep": CALCULATE(
          CALCULATE(rows, KEEPFILTERS(d <= DATE(2024, 1, 10))), Cal["Month"] == "2024-02"
      ),
      "TimeIntel": CALCULATE(CALCULATE(rows, PREVIOUSMONTH(d)), Cal["Month"] == "2024-03"),
  }))
dax: |
  EVALUATE
      ROW("Rows", COUNTROWS(Cal), "Boolean", CALCULATE(CALCULATE(COUNTROWS(Cal), Cal[Date] <= DATE(2024, 1, 10)), Cal[Month] = "2024-02"), "Keep", CALCULATE(CALCULATE(COUNTROWS(Cal), KEEPFILTERS(Cal[Date] <= DATE(2024, 1, 10))), Cal[Month] = "2024-02"), "TimeIntel", CALCULATE(CALCULATE(COUNTROWS(Cal), PREVIOUSMONTH(Cal[Date])), Cal[Month] = "2024-03"))

id: time-intelligence-date-sets
description: >-
  Every date-set function in twelve filter contexts on a contiguous calendar, shown as first..last#rows.
  Results come from all the column's dates, whatever the filters. DATESYTD/QTD/MTD run from the period
  start to the last visible date (a "6/30" year end starts the year on July 1). DATEADD shifts a range,
  clamping like EDATE. PARALLELPERIOD shifts whole periods. DATESINPERIOD counts from its start date.
  DATESBETWEEN reads a BLANK bound as the first or last date. PREVIOUS* work from the first visible date
  and NEXT* from the last, returning whole periods. STARTOF*/ENDOF* return the column's first or last
  date in the period.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Dates:
      calendar:
        start: 2023-01-01
        end: 2024-12-31
    Txn:
      columns:
        TxnID: integer
        TxnDate: date
        Amount: decimal
      rows:
      - [1, 2023-01-15, 100.0]
      - [2, 2023-02-28, 40.0]
      - [3, 2023-03-31, 25.0]
      - [4, 2023-06-30, 60.0]
      - [5, 2023-10-05, 80.0]
      - [6, 2023-12-31, 30.0]
      - [7, 2024-01-01, 10.0]
      - [8, 2024-01-31, 45.0]
      - [9, 2024-02-29, 20.0]
      - [10, 2024-03-01, 15.0]
      - [11, 2024-04-30, 70.0]
      - [12, 2024-07-04, 35.0]
      - [13, 2024-12-31, 50.0]
  relationships:
  - from: Txn[TxnDate]
    to: Dates[Date]
python: |
  d = Dates["Date"]
  total = model.add_measure("TxnTotal", SUM(Txn["Amount"]), table="Txn")


  def span(t, col=d):
      """First..last date and row count of a table of dates, as text."""
      first = FORMAT(MINX(t, col), "yyyy-mm-dd")
      last = FORMAT(MAXX(t, col), "yyyy-mm-dd")
      return first.concat("..").concat(last).concat("#").concat(COUNTROWS(t))

  sets = {
      "YTD": DATESYTD(d), "YTDfy": DATESYTD(d, "6/30"), "QTD": DATESQTD(d), "MTD": DATESMTD(d),
      "SPLY": SAMEPERIODLASTYEAR(d), "AddM": DATEADD(d, -1, MONTH), "AddMp": DATEADD(d, 1, MONTH),
      "AddQ": DATEADD(d, -1, QUARTER), "AddD": DATEADD(d, -10, DAY), "AddY": DATEADD(d, 1, YEAR),
      "PPM": PARALLELPERIOD(d, -1, MONTH), "PPQ": PARALLELPERIOD(d, 1, QUARTER),
      "PPY": PARALLELPERIOD(d, -1, YEAR),
      "InP": DATESINPERIOD(d, MAX(d), -1, MONTH), "InPd": DATESINPERIOD(d, MAX(d), -7, DAY),
      "InPy": DATESINPERIOD(d, MIN(d), 1, YEAR),
      "Btw": DATESBETWEEN(d, DATE(2024, 2, 27), BLANK()),
      "Btw0": DATESBETWEEN(d, BLANK(), DATE(2023, 1, 3)),
      "PD": PREVIOUSDAY(d), "PM": PREVIOUSMONTH(d), "PQ": PREVIOUSQUARTER(d), "PY": PREVIOUSYEAR(d),
      "ND": NEXTDAY(d), "NM": NEXTMONTH(d), "NQ": NEXTQUARTER(d), "NY": NEXTYEAR(d),
      "FD": FIRSTDATE(d), "LD": LASTDATE(d),
      "SM": STARTOFMONTH(d), "SQ": STARTOFQUARTER(d), "SY": STARTOFYEAR(d),
      "EM": ENDOFMONTH(d), "EQ": ENDOFQUARTER(d), "EY": ENDOFYEAR(d), "EYfy": ENDOFYEAR(d, "6/30"),
  }
  contexts = DATATABLE({"C": "STRING", "S": "DATETIME", "E": "DATETIME"}, [
      ["d", "2024-02-15", "2024-02-15"],
      ["feb", "2024-02-01", "2024-02-29"],
      ["mar", "2024-03-01", "2024-03-31"],
      ["rng", "2024-01-15", "2024-02-10"],
      ["y24", "2024-01-01", "2024-12-31"],
      ["eom", "2024-03-31", "2024-03-31"],
      ["leap", "2024-02-29", "2024-02-29"],
      ["q1", "2024-01-01", "2024-03-31"],
      ["all", "2023-01-01", "2024-12-31"],
      ["jan23", "2023-01-01", "2023-01-31"],
      ["dec24", "2024-12-01", "2024-12-31"],
      ["aprmay", "2024-04-15", "2024-05-31"],
  ])
  in_context = DATESBETWEEN(d, contexts["S"], contexts["E"])
  columns = {name: CALCULATE(span(t), in_context) for name, t in sets.items()}
  result = model.evaluate(ADDCOLUMNS(contexts, columns))

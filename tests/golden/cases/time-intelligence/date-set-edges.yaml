2024, 4, 30))), "H", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], -1, MONTH)), DATESBETWEEN(Dates[Date], DATE(2024, 4, 16), DATE(2024, 4, 30))), "I", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], -1, MONTH)), Dates[Date] IN {DATE(2024, 2, 10), DATE(2024, 2, 29)}), "J", CALCULATE(FORMAT(MINX(SAMEPERIODLASTYEAR(Dates[Date]), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(SAMEPERIODLASTYEAR(Dates[Date]), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(SAMEPERIODLASTYEAR(Dates[Date])), DATESBETWEEN(Dates[Date], DATE(2024, 2, 28), DATE(2024, 2, 29))), "K", CALCULATE(FORMAT(MINX(SAMEPERIODLASTYEAR(Dates[Date]), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(SAMEPERIODLASTYEAR(Dates[Date]), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(SAMEPERIODLASTYEAR(Dates[Date])), DATESBETWEEN(Dates[Date], DATE(2024, 2, 1), DATE(2024, 2, 28))), "L", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], 1, YEAR), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], 1, YEAR), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], 1, YEAR)), DATESBETWEEN(Dates[Date], DATE(2023, 2, 1), DATE(2023, 2, 28))), "M", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], 1, YEAR), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], 1, YEAR), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], 1, YEAR)), DATESBETWEEN(Dates[Date], DATE(2023, 2, 28), DATE(2023, 2, 28))), "N", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], 1, YEAR), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], 1, YEAR), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], 1, YEAR)), DATESBETWEEN(Dates[Date], DATE(2023, 2, 15), DATE(2023, 2, 28))), "O", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], 1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], 1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], 1, MONTH)), DATESBETWEEN(Dates[Date], DATE(2024, 1, 31), DATE(2024, 2, 2))), "P", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], -1, MONTH)), DATESBETWEEN(Dates[Date], DATE(2024, 3, 30), DATE(2024, 3, 31))), "Q", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], -1, MONTH)), Dates[Date] IN {DATE(2024, 3, 31), DATE(2024, 4, 30)}), "R", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], 2, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], 2, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], 2, MONTH)), DATESBETWEEN(Dates[Date], DATE(2023, 12, 31), DATE(2023, 12, 31))), "S1", FORMAT(MINX(DATESINPERIOD(Dates[Date], DATE(2024, 4, 30), -1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATESINPERIOD(Dates[Date], DATE(2024, 4, 30), -1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATESINPERIOD(Dates[Date], DATE(2024, 4, 30), -1, MONTH)), "S2", FORMAT(MINX(DATESINPERIOD(Dates[Date], DATE(2024, 2, 28), -1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATESINPERIOD(Dates[Date], DATE(2024, 2, 28), -1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATESINPERIOD(Dates[Date], DATE(2024, 2, 28), -1, MONTH)), "S3", FORMAT(MINX(DATESINPERIOD(Dates[Date], DATE(2024, 1, 31), 1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATESINPERIOD(Dates[Date], DATE(2024, 1, 31), 1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATESINPERIOD(Dates[Date], DATE(2024, 1, 31), 1, MONTH)), "S4", FORMAT(MINX(DATESINPERIOD(Dates[Date], DATE(2023, 2, 28), 1, YEAR), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATESINPERIOD(Dates[Date], DATE(2023, 2, 28), 1, YEAR), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATESINPERIOD(Dates[Date], DATE(2023, 2, 28), 1, YEAR)), "S5", FORMAT(MINX(DATESINPERIOD(Dates[Date], DATE(2024, 2, 29), -1, YEAR), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATESINPERIOD(Dates[Date], DATE(2024, 2, 29), -1, YEAR), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATESINPERIOD(Dates[Date], DATE(2024, 2, 29), -1, YEAR)), "T1", FORMAT(MINX(DATEADD(Txn[TxnDate], -1, YEAR), Txn[TxnDate]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Txn[TxnDate], -1, YEAR), Txn[TxnDate]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Txn[TxnDate], -1, YEAR)), "T2", CALCULATE(FORMAT(MINX(DATESYTD(Txn[TxnDate]), Txn[TxnDate]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATESYTD(Txn[TxnDate]), Txn[TxnDate]), "yyyy-mm-dd") & "#" & COUNTROWS(DATESYTD(Txn[TxnDate])), Dates[Month] = "2024-02"), "T3", CALCULATE(FORMAT(MINX(DATEADD(Txn[TxnDate], 1, MONTH), Txn[TxnDate]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Txn[TxnDate], 1, MONTH), Txn[TxnDate]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Txn[TxnDate], 1, MONTH)), Dates[Month] = "2024-01"), "T4", CALCULATE(FORMAT(MINX(PREVIOUSMONTH(Txn[TxnDate]), Txn[TxnDate]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(PREVIOUSMONTH(Txn[TxnDate]), Txn[TxnDate]), "yyyy-mm-dd") & "#" & COUNTROWS(PREVIOUSMONTH(Txn[TxnDate])), Dates[Month] = "2024-03"), "U1", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], -1, MONTH), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], -1, MONTH)), DATESBETWEEN(Dates[Date], DATE(2024, 2, 29), DATE(2024, 3, 1))), "U2", CALCULATE(FORMAT(MINX(DATEADD(Dates[Date], 1, QUARTER), Dates[Date]), "yyyy-mm-dd") & ".." & FORMAT(MAXX(DATEADD(Dates[Date], 1, QUARTER), Dates[Date]), "yyyy-mm-dd") & "#" & COUNTROWS(DATEADD(Dates[Date], 1
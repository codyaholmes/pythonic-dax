id: time-intelligence-calendar
description: >-
  CALENDAR returns one row per day between two dates, in a column named Date.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Dates:
      calendar:
        start: 2023-01-01
        end: 2024-12-31
    Txn:
      columns:
        TxnID: integer
        TxnDate: date
        Amount: decimal
      rows:
      - [1, 2023-01-15, 100.0]
      - [2, 2023-02-28, 40.0]
      - [3, 2023-03-31, 25.0]
      - [4, 2023-06-30, 60.0]
      - [5, 2023-10-05, 80.0]
      - [6, 2023-12-31, 30.0]
      - [7, 2024-01-01, 10.0]
      - [8, 2024-01-31, 45.0]
      - [9, 2024-02-29, 20.0]
      - [10, 2024-03-01, 15.0]
      - [11, 2024-04-30, 70.0]
      - [12, 2024-07-04, 35.0]
      - [13, 2024-12-31, 50.0]
  relationships:
  - from: Txn[TxnDate]
    to: Dates[Date]
python: |
  d = Dates["Date"]
  total = model.add_measure("TxnTotal", SUM(Txn["Amount"]), table="Txn")
  result = model.evaluate(CALENDAR(DATE(2024, 2, 27), DATE(2024, 3, 2)))
dax: |
  EVALUATE
      CALENDAR(DATE(2024, 2, 27), DATE(2024, 3, 2))
expected:
  ordered: false
  columns:
    '[Date]': date
  rows:
  - [2024-02-27]
  - [2024-02-28]
  - [2024-02-29]
  - [2024-03-01]
  - [2024-03-02]

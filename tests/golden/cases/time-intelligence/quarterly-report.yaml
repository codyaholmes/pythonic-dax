    60.0]
  - [2024, 2, 70.0, 70.0, 115.0, 90.0, 35.0, 335.0, 335.0, null, null, null, null,
    null]
  - [2024, 3, 35.0, 35.0, 115.0, 70.0, 50.0, 335.0, 335.0, null, null, null, 50.0,

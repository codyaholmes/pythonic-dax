id: time-intelligence-quarterly-report
description: >-
  A report by year and quarter: quarter-to-date, year-to-date with an extra filter, previous and next
  quarter, the same quarter a year earlier, previous and next year, quarter opening and closing balances,
  a fiscal-year closing balance and month-to-date.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Dates:
      calendar:
        start: 2023-01-01
        end: 2024-12-31
    Txn:
      columns:
        TxnID: integer
        TxnDate: date
        Amount: decimal
      rows:
      - [1, 2023-01-15, 100.0]
      - [2, 2023-02-28, 40.0]
      - [3, 2023-03-31, 25.0]
      - [4, 2023-06-30, 60.0]
      - [5, 2023-10-05, 80.0]
      - [6, 2023-12-31, 30.0]
      - [7, 2024-01-01, 10.0]
      - [8, 2024-01-31, 45.0]
      - [9, 2024-02-29, 20.0]
      - [10, 2024-03-01, 15.0]
      - [11, 2024-04-30, 70.0]
      - [12, 2024-07-04, 35.0]
      - [13, 2024-12-31, 50.0]
  relationships:
  - from: Txn[TxnDate]
    to: Dates[Date]
python: |
  d = Dates["Date"]
  total = model.add_measure("TxnTotal", SUM(Txn["Amount"]), table="Txn")
  result = model.evaluate(SUMMARIZECOLUMNS(Dates["Year"], Dates["Quarter"], {
      "Total": total,
      "QTD": TOTALQTD(total, d),
      "YTDbig": TOTALYTD(total, d, Txn["Amount"] >= 40),
      "PQ": CALCULATE(total, PREVIOUSQUARTER(d)),
      "NQ": CALCULATE(total, NEXTQUARTER(d)),
      "PPY": CALCULATE(total, PARALLELPERIOD(d, -1, YEAR)),
      "PrevY": CALCULATE(total, PREVIOUSYEAR(d)),
      "NextY": CALCULATE(total, NEXTYEAR(d)),
      "OpenQ": OPENINGBALANCEQUARTER(total, d),
      "CloseQ": CLOSINGBALANCEQUARTER(total, d),
      "CloseFY": CLOSINGBALANCEYEAR(total, d, year_end_date="6/30"),
      "MTD": TOTALMTD(total, d),
  }))
dax: |
  DEFINE
      MEASURE Txn[TxnTotal] = SUM(Txn[Amount])
  EVALUATE
      SUMMARIZECOLUMNS(Dates[Year], Dates[Quarter], "Total", [TxnTotal], "QTD", TOTALQTD([TxnTotal], Dates[Date]), "YTDbig", TOTALYTD([TxnTotal], Dates[Date], Txn[Amount] >= 40), "PQ", CALCULATE([TxnTotal], PREVIOUSQUARTER(Dates[Date])), "NQ", CALCULATE([TxnTotal], NEXTQUARTER(Dates[Date])), "PPY", CALCULATE([TxnTotal], PARALLELPERIOD(Dates[Date], -1, YEAR)), "PrevY", CALCULATE([TxnTotal], PREVIOUSYEAR(Dates[Date])), "NextY", CALCULATE([TxnTotal], NEXTYEAR(Dates[Date])), "OpenQ", OPENINGBALANCEQUARTER([TxnTotal], Dates[Date]), "CloseQ", CLOSINGBALANCEQUARTER([TxnTotal], Dates[Date]), "CloseFY", CLOSINGBALANCEYEAR([TxnTotal], Dates[Date], "6/30"), "MTD", TOTALMTD([TxnTotal], Dates[Date]))

id: time-intelligence-date-filter-clears-table
description: >-
  A CALCULATE filter on a Date/Time column that is the one side of a relationship also removes the filters
  on the rest of its table, even when the table isn't marked as a date table. This holds for True/False
  filters, TREATAS, FILTER(ALL(<column>)) and time intelligence tables. It doesn't with KEEPFILTERS, for
  a filter on another column of the table, or for a date column on the many side.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Dates:
      calendar:
        start: 2023-01-01
        end: 2024-12-31
    Txn:
      columns:
        TxnID: integer
        TxnDate: date
        Amount: decimal
      rows:
      - [1, 2023-01-15, 100.0]
      - [2, 2023-02-28, 40.0]
      - [3, 2023-03-31, 25.0]
      - [4, 2023-06-30, 60.0]
      - [5, 2023-10-05, 80.0]
      - [6, 2023-12-31, 30.0]
      - [7, 2024-01-01, 10.0]
      - [8, 2024-01-31, 45.0]
      - [9, 2024-02-29, 20.0]
      - [10, 2024-03-01, 15.0]
      - [11, 2024-04-30, 70.0]
      - [12, 2024-07-04, 35.0]
      - [13, 2024-12-31, 50.0]
  relationships:
  - from: Txn[TxnDate]
    to: Dates[Date]
python: |
  d = Dates["Date"]
  total = model.add_measure("TxnTotal", SUM(Txn["Amount"]), table="Txn")
  rows = COUNTROWS(Dates)
  in_2024 = Dates["Year"] == 2024
  march = Dates["Month"] == "2024-03"
  result = model.evaluate(ROW({
      "Boolean": CALCULATE(CALCULATE(rows, d <= DATE(2023, 1, 10)), in_2024),
      "Keep": CALCULATE(CALCULATE(rows, KEEPFILTERS(d <= DATE(2023, 1, 10))), in_2024),
      "TreatAs": CALCULATE(CALCULATE(rows, TREATAS([DATE(2023, 5, 1)], d)), in_2024),
      "FilterAll": CALCULATE(CALCULATE(rows, FILTER(ALL(d), d < DATE(2023, 1, 4))), in_2024),
      "TimeIntel": CALCULATE(CALCULATE(rows, PREVIOUSMONTH(d)), march),
      "TimeIntelKeep": CALCULATE(CALCULATE(rows, KEEPFILTERS(PREVIOUSMONTH(d))), march),
      "OtherColumn": CALCULATE(CALCULATE(rows, Dates["Year"] == 2023), march),
      "ManySide": CALCULATE(
          CALCULATE(COUNTROWS(Txn), Txn["TxnDate"] <= DATE(2023, 6, 30)), Txn["Amount"] >= 60
      ),
      "Measure": CALCULATE(CALCULATE(total, d <= DATE(2023, 3, 31)), in_2024),
  }))
dax: |
  DEFINE
      MEASURE Txn[TxnTotal] = SUM(Txn[Amount])
  EVALUATE
      ROW("Boolean", CALCULATE(CALCULATE(COUNTROWS(Dates), Dates[Date] <= DATE(2023, 1, 10)), Dates[Year] = 2024), "Keep", CALCULATE(CALCULATE(COUNTROWS(Dates), KEEPFILTERS(Dates[Date] <= DATE(2023, 1, 10))), Dates[Year] = 2024), "TreatAs", CALCULATE(CALCULATE(COUNTROWS(Dates), TREATAS({DATE(2023, 5, 1)}, Dates[Date])), Dates[Year] = 2024), "FilterAll", CALCULATE(CALCULATE(COUNTROWS(Dates), FILTER(ALL(Dates[Date]), Dates[Date] < DATE(2023, 1, 4))), Dates[Year] = 2024), "TimeIntel", CALCULATE(CALCULATE(COUNTROWS(Dates), PREVIOUSMONTH(Dates[Date])), Dates[Month] = "2024-03"), "TimeIntelKeep", CALCULATE(CALCULATE(COUNTROWS(Dates), KEEPFILTERS(PREVIOUSMONTH(Dates[Date]))), Dates[Month] = "2024-03"), "OtherColumn", CALCULATE(CALCULATE(COUNTROWS(Dates), Dates[Year] = 2023), Dates[Month] = "2024-03"), "ManySide", CALCULATE(CALCULATE(COUNTROWS(Txn), Txn[TxnDate] <= DATE(2023, 6, 30)), Txn[Amount] >= 60), "Measure", CALCULATE(CALCULATE([TxnTotal], Dates[Date] <= DATE(2023, 3, 31)), Dates[Year] = 2024))
expected:
  ordered: false
  columns:
    '[Boolean]': integer
    '[Keep]': integer
    '[TreatAs]': integer
    '[FilterAll]': integer
    '[TimeIntel]': integer
    '[TimeIntelKeep]': integer
    '[OtherColumn]': integer
    '[ManySide]': integer
    '[Measure]': decimal
  rows:
  - [10, null, 1, 3, 29, null, null, 2, 165.0]

id: time-intelligence-monthly-report
description: >-
  A monthly report (milestone M7): totals, year-to-date (calendar and a June 30 fiscal year), quarter-to-date,
  prior year, prior year-to-date, previous month, a rolling three months, and the opening and closing
  balances of the month and year. Year-to-date resets at each year boundary. Over Txn[TxnDate], the many
  side of the relationship, TOTALYTD doesn't clear the month filter and returns the month's own total.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Dates:
      calendar:
        start: 2023-01-01
        end: 2024-12-31
    Txn:
      columns:
        TxnID: integer
        TxnDate: date
        Amount: decimal
      rows:
      - [1, 2023-01-15, 100.0]
      - [2, 2023-02-28, 40.0]
      - [3, 2023-03-31, 25.0]
      - [4, 2023-06-30, 60.0]
      - [5, 2023-10-05, 80.0]
      - [6, 2023-12-31, 30.0]
      - [7, 2024-01-01, 10.0]
      - [8, 2024-01-31, 45.0]
      - [9, 2024-02-29, 20.0]
      - [10, 2024-03-01, 15.0]
      - [11, 2024-04-30, 70.0]
      - [12, 2024-07-04, 35.0]
      - [13, 2024-12-31, 50.0]
  relationships:
  - from: Txn[TxnDate]
    to: Dates[Date]
python: |
  d = Dates["Date"]
  total = model.add_measure("TxnTotal", SUM(Txn["Amount"]), table="Txn")
  result = model.evaluate(SUMMARIZECOLUMNS(Dates["Month"], {
      "Total": total,
      "YTD": TOTALYTD(total, d),
      "FYTD": TOTALYTD(total, d, year_end_date="6/30"),
      "QTD": TOTALQTD(total, d),
      "PY": CALCULATE(total, SAMEPERIODLASTYEAR(d)),
      "PYTD": CALCULATE(total, DATESYTD(SAMEPERIODLASTYEAR(d))),
      "PM": CALCULATE(total, PREVIOUSMONTH(d)),
      "MoM": CALCULATE(total, DATEADD(d, -1, MONTH)),
      "Last3": CALCULATE(total, DATESINPERIOD(d, MAX(d), -3, MONTH)),
      "Open": OPENINGBALANCEMONTH(total, d),
      "Close": CLOSINGBALANCEMONTH(total, d),
      "OpenY": OPENINGBALANCEYEAR(total, d),
      "CloseY": CLOSINGBALANCEYEAR(total, d),
      "YTDbyTxn": TOTALYTD(total, Txn["TxnDate"]),
  }))
dax: |
  DEFINE
      MEASURE Txn[TxnTotal] = SUM(Txn[Amount])
  EVALUATE
      SUMMARIZECOLUMNS(Dates[Month], "Total", [TxnTotal], "YTD", TOTALYTD([TxnTotal], Dates[Date]), "FYTD", TOTALYTD([TxnTotal], Dates[Date], "6/30"), "QTD", TOTALQTD([TxnTotal], Dates[Date]), "PY", CALCULATE([TxnTotal], SAMEPERIODLASTYEAR(Dates[Date])), "PYTD", CALCULATE([TxnTotal], DATESYTD(SAMEPERIODLASTYEAR(Dates[Date]))), "PM", CALCULATE([TxnTotal], PREVIOUSMONTH(Dates[Date])), "MoM", CALCULATE([TxnTotal], DATEADD(Dates[Date], -1, MONTH)), "Last3", CALCULATE([TxnTotal], DATESINPERIOD(Dates[Date], MAX(Dates[Date]), -3, MONTH)), "Open", OPENINGBALANCEMONTH([TxnTotal], Dates[Date]), "Close", CLOSINGBALANCEMONTH([TxnTotal], Dates[Date]), "OpenY", OPENINGBALANCEYEAR([TxnTotal], Dates[Date]), "CloseY", CLOSINGBALANCEYEAR([TxnTotal], Dates[Date]), "YTDbyTxn", TOTALYTD([TxnTotal], Txn[TxnDate]))

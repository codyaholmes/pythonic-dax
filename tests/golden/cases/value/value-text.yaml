id: value-text
description: >-
  A text result comes back as a str: SELECTEDVALUE under a filter that leaves one customer.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data (tables VCustomer and VSales in Test Landing, since Customer and Sales there hold other cases' rows)
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Customer:
      columns:
        CustomerKey: integer
        Tier: string
      rows:
      - [1, Gold]
      - [2, Silver]
      - [3, Gold]
      - [4, Bronze]
    Sales:
      columns:
        SaleID: integer
        CustomerKey: integer
        OrderDate: date
        Amount: currency
        Qty: integer
      rows:
      - [1, 1, 2024-01-05, 10.5, 1]
      - [2, 2, 2024-01-20, 2.25, 2]
      - [3, 3, 2024-02-03, 1, 3]
      - [4, 9, 2024-02-10, 100, 4]
      - [5, 1, 2024-03-15, 4.125, 2]
      - [6, null, 2024-03-01, 7.75, 1]
  relationships:
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
python: |
  result = model.value(SELECTEDVALUE(Customer["Tier"]), Customer["CustomerKey"] == 2)
dax: |
  EVALUATE
      ROW("Value", CALCULATE(SELECTEDVALUE(Customer[Tier]), Customer[CustomerKey] = 2))
expected:
  value: Silver
  type: string

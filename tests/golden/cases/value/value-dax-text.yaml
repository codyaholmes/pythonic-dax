id: value-dax-text
description: >-
  model.value() takes a measure by name and filters as DAX text, and builds the same query as the Python
  functions. KEEPFILTERS intersects with the other filter.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data (tables VCustomer and VSales in Test Landing, since Customer and Sales there hold other cases' rows)
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Customer:
      columns:
        CustomerKey: integer
        Tier: string
      rows:
      - [1, Gold]
      - [2, Silver]
      - [3, Gold]
      - [4, Bronze]
    Sales:
      columns:
        SaleID: integer
        CustomerKey: integer
        OrderDate: date
        Amount: currency
        Qty: integer
      rows:
      - [1, 1, 2024-01-05, 10.5, 1]
      - [2, 2, 2024-01-20, 2.25, 2]
      - [3, 3, 2024-02-03, 1, 3]
      - [4, 9, 2024-02-10, 100, 4]
      - [5, 1, 2024-03-15, 4.125, 2]
      - [6, null, 2024-03-01, 7.75, 1]
  relationships:
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  result = model.value("Total", 'Customer[Tier] IN {"Gold", "Silver"}', "KEEPFILTERS(Sales[Qty] >= 2)")
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
  EVALUATE
      ROW("Value", CALCULATE([Total], Customer[Tier] IN {"Gold", "Silver"}, KEEPFILTERS(Sales[Qty] >= 2)))
expected:
  value: 7.3750
  type: currency

id: group-values-blank-row
description: >-
  The blank row's BLANK key is a group-by value whenever the table has a blank row, even when no unmatched
  sale is visible.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  result = model.evaluate(CALCULATETABLE(
      SUMMARIZECOLUMNS(Product["ProductKey"], {"C": 1, "N": COUNTROWS(Sales)}),
      Sales["SaleID"] == 1,
  ))
dax: |
  EVALUATE
      CALCULATETABLE(SUMMARIZECOLUMNS(Product[ProductKey], "C", 1, "N", COUNTROWS(Sales)), Sales[SaleID] = 1)
expected:
  ordered: false
  columns:
    Product[ProductKey]: integer
    '[C]': integer
    '[N]': integer
  rows:
  - [1, 1, 1]
  - [2, 1, null]
  - [3, 1, null]
  - [4, 1, null]
  - [null, 1, null]

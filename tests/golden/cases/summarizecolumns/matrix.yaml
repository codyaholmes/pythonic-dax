id: matrix
description: >-
  A matrix with customer and color rows, subtotals and a grand total. Combinations with no sales are left
  out. Subtotals are computed from the filters, not by adding up the detail rows (see Avg).
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  result = model.evaluate(SUMMARIZECOLUMNS(
      ROLLUPADDISSUBTOTAL(Customer["Name"], "IsNameTotal", Product["Color"], "IsColorTotal"),
      {"Total": total, "Rows": COUNTROWS(Sales), "Avg": AVERAGEX(Sales, Sales["Amount"])},
  ))
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
  EVALUATE
      SUMMARIZECOLUMNS(ROLLUPADDISSUBTOTAL(Customer[Name], "IsNameTotal", Product[Color], "IsColorTotal"), "Total", [Total], "Rows", COUNTROWS(Sales), "Avg", AVERAGEX(Sales, Sales[Amount]))
expected:
  ordered: false
  columns:
    Customer[Name]: string
    Product[Color]: string
    '[IsNameTotal]': boolean
    '[IsColorTotal]': boolean
    '[Total]': decimal
    '[Rows]': integer
    '[Avg]': decimal
  rows:
  - [Ann, Red, false, false, 10, 1, 10]
  - [Ann, Green, false, false, 7.25, 1, 7.25]
  - [Bob, null, false, false, 100, 1, 100]
  - [Bob, Red, false, false, 5.5, 1, 5.5]
  - [Cy, null, false, false, 1, 1, 1]
  - [Ann, null, false, true, 17.25, 2, 8.625]
  - [Bob, null, false, true, 105.5, 2, 52.75]
  - [Cy, null, false, true, 1, 1, 1]
  - [null, null, true, true, 123.75, 5, 24.75]

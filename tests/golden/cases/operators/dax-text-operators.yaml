id: dax-text-operators
description: >-
  DAX text through the parser: ^ binds tighter than the sign and groups to the right
  (-2 ^ 2 is -4, 2 ^ 3 ^ 2 is 512), & is below + and -, NOT is below comparisons,
  nested VAR blocks, and an unqualified [Column] in an iterator reads the row context.
source: powerbi
reference: >-
  Power BI Desktop (Shop Test.pbix with the same made-up tables as
  tests/fixtures/shop.SemanticModel), query tool
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tmdl: shop.SemanticModel
  tables:
    Product:
      columns: {ProductKey: integer, Color: string, Launch Date: date}
      rows:
        - [1, Red, 2023-01-01]
        - [2, Blue, 2023-01-01]
        - [3, Red, 2023-01-01]
    Sales:
      columns: {ProductKey: integer, Order Date: date, Ship Date: date, Qty: integer, Price: currency}
      rows:
        - [1, 2024-01-05, 2024-01-09, 1, 10.0]
        - [1, 2024-02-05, 2024-03-01, 2, 10.0]
        - [2, 2024-02-09, 2024-02-10, 3, 5.5]
        - [3, 2024-03-01, 2024-03-03, 4, 2.25]
        - [4, 2024-03-02, 2024-03-09, 5, 1.0]
python: |
  result = model.evaluate_dax(
      'EVALUATE ROW("a", -2 ^ 2, "b", 2 ^ 3 ^ 2, "c", 2 ^ -1, "d", "a" & 1 + 2, '
      '"e", NOT 1 = 2 && TRUE, "h", VAR a = VAR b = 4 RETURN b * 2 RETURN a + 1, '
      '"u", SUMX(Sales, [Qty]), "v", SUMX(Sales, [Qty] * [Price]), '
      '"w", CALCULATE(SUMX(Sales, [Qty]), Product[Color] = "Red"))'
  )
dax: |
  EVALUATE
      ROW("a", -2 ^ 2, "b", 2 ^ 3 ^ 2, "c", 2 ^ (-1), "d", "a" & 1 + 2, "e", NOT(1 = 2) && TRUE(), "h", VAR a = VAR b = 4 RETURN b * 2 RETURN a + 1, "u", SUMX(Sales, [Qty]), "v", SUMX(Sales, [Qty] * [Price]), "w", CALCULATE(SUMX(Sales, [Qty]), Product[Color] = "Red"))
expected:
  ordered: false
  columns:
    '[a]': decimal
    '[b]': decimal
    '[c]': decimal
    '[d]': string
    '[e]': boolean
    '[h]': integer
    '[u]': integer
    '[v]': currency
    '[w]': integer
  rows:
    - [-4.0, 512.0, 0.5, a3, true, 9, 15, 60.5, 7]

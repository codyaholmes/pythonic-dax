id: power-of-blank
description: BLANK() ^ BLANK() is an error in Power BI.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
python: |
  result = model.evaluate(ROW("Power", BLANK() ** BLANK()))
dax: |
  EVALUATE
      ROW("Power", BLANK() ^ BLANK())
expected:
  error:
    type: DaxError
    message_matches: POWER

id: blank-arithmetic
description: >
  BLANK behaves like zero in addition but stays BLANK in multiplication.
  BLANK() + 1 returns 1, while BLANK() * 1 returns BLANK.
source: documented
reference: https://www.sqlbi.com/articles/blank-handling-in-dax/
powerbi_version: null
python: |
  result = model.evaluate(ROW("Plus", BLANK() + 1, "Times", BLANK() * 1))
dax: |
  EVALUATE ROW("Plus", BLANK() + 1, "Times", BLANK() * 1)
expected:
  columns:
    "[Plus]": integer
    "[Times]": integer
  rows:
    - [1, null]

id: calculated-columns-related
description: Calculated columns in Sales. RELATED follows many-to-one relationships and gives BLANK when
  there is no matching row. Amount * BLANK Qty is BLANK.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  model.add_column(Sales, "Color", RELATED(Product["Color"]))
  model.add_column(Sales, "Line", Sales["Amount"] * Sales["Qty"])
  model.add_column(Sales, "Cust", RELATED(Customer["Name"]))
  result = model.evaluate(SUMMARIZECOLUMNS(
      Sales["SaleID"], Sales["Color"], Sales["Line"], Sales["Cust"], {"N": COUNTROWS(Sales)}
  ))
dax: |
  DEFINE
      COLUMN Sales[Color] = RELATED(Product[Color])
      COLUMN Sales[Line] = Sales[Amount] * Sales[Qty]
      COLUMN Sales[Cust] = RELATED(Customer[Name])
  EVALUATE
      SUMMARIZECOLUMNS(Sales[SaleID], Sales[Color], Sales[Line], Sales[Cust], "N", COUNTROWS(Sales))
expected:
  ordered: false
  columns:
    Sales[SaleID]: integer
    Sales[Color]: string
    Sales[Line]: decimal
    Sales[Cust]: string
    '[N]': integer
  rows:
  - [1, Red, 10, Ann, 1]
  - [2, Red, 11, Bob, 1]
  - [3, Green, null, Ann, 1]
  - [4, null, 400, Bob, 1]
  - [5, null, 1, Cy, 1]

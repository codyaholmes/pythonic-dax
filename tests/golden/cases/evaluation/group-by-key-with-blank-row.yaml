id: group-by-key-with-blank-row
description: Grouping by the one-side key shows a BLANK group for the unmatched sales. COUNT returns BLANK
  when there is nothing to count.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  cnt = model.add_measure("Cnt Note", COUNT(Sales["Note"]), table="Sales")
  low = model.add_measure("Min Note", MIN(Sales["Note"]), table="Sales")
  result = model.evaluate(SUMMARIZECOLUMNS(
      Product["ProductKey"], {"Total": total, "CntNote": cnt, "MinNote": low}
  ))
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
      MEASURE Sales[Cnt Note] = COUNT(Sales[Note])
      MEASURE Sales[Min Note] = MIN(Sales[Note])
  EVALUATE
      SUMMARIZECOLUMNS(Product[ProductKey], "Total", [Total], "CntNote", [Cnt Note], "MinNote", [Min Note])
expected:
  ordered: false
  columns:
    Product[ProductKey]: integer
    '[Total]': decimal
    '[CntNote]': integer
    '[MinNote]': string
  rows:
  - [null, 101, 2, b]
  - [1, 15.5, 2, a]
  - [2, 7.25, null, null]

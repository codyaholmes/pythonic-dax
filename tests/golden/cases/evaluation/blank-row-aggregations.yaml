id: blank-row-aggregations
description: Product has a hidden blank row because some sales have no matching product. COUNTROWS, DISTINCTCOUNT
  and COUNTBLANK never count that blank row; only the real row with a blank color counts.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  result = model.evaluate(ROW(
      "RowsProduct", COUNTROWS(Product), "DistinctColor", DISTINCTCOUNT(Product["Color"]),
      "DistinctColorNoBlank", DISTINCTCOUNTNOBLANK(Product["Color"]),
      "BlankColors", COUNTBLANK(Product["Color"]), "CountColor", COUNT(Product["Color"]),
      "CountaColor", COUNTA(Product["Color"]), "CountKey", COUNT(Product["ProductKey"]),
      "BlankQty", COUNTBLANK(Sales["Qty"]), "SumQty", SUM(Sales["Qty"]),
      "AvgQty", AVERAGE(Sales["Qty"]), "MinColor", MIN(Product["Color"]),
      "MaxColor", MAX(Product["Color"]), "DistinctProductKey", DISTINCTCOUNT(Product["ProductKey"]),
      "DistinctSalesKey", DISTINCTCOUNT(Sales["ProductKey"]),
  ))
dax: |
  EVALUATE
      ROW("RowsProduct", COUNTROWS(Product), "DistinctColor", DISTINCTCOUNT(Product[Color]), "DistinctColorNoBlank", DISTINCTCOUNTNOBLANK(Product[Color]), "BlankColors", COUNTBLANK(Product[Color]), "CountColor", COUNT(Product[Color]), "CountaColor", COUNTA(Product[Color]), "CountKey", COUNT(Product[ProductKey]), "BlankQty", COUNTBLANK(Sales[Qty]), "SumQty", SUM(Sales[Qty]), "AvgQty", AVERAGE(Sales[Qty]), "MinColor", MIN(Product[Color]), "MaxColor", MAX(Product[Color]), "DistinctProductKey", DISTINCTCOUNT(Product[ProductKey]), "DistinctSalesKey", DISTINCTCOUNT(Sales[ProductKey]))
expected:
  ordered: false
  columns:
    '[RowsProduct]': integer
    '[DistinctColor]': integer
    '[DistinctColorNoBlank]': integer
    '[BlankColors]': integer
    '[CountColor]': integer
    '[CountaColor]': integer
    '[CountKey]': integer
    '[BlankQty]': integer
    '[SumQty]': integer
    '[AvgQty]': decimal
    '[MinColor]': string
    '[MaxColor]': string
    '[DistinctProductKey]': integer
    '[DistinctSalesKey]': integer
  rows:
  - [4, 4, 3, 1, 3, 3, 4, 1, 8, 2, Blue, Red, 4, 4]

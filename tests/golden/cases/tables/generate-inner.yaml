id: generate-inner
description: >-
  GENERATE drops outer rows whose inner table is empty.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  big = FILTER(VALUES(Customer["Name"]), total > 50)
  result = model.evaluate(GENERATE(VALUES(Product["Color"]), big))
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
  EVALUATE
      GENERATE(VALUES(Product[Color]), FILTER(VALUES(Customer[Name]), [Total] > 50))
expected:
  ordered: false
  columns:
    Product[Color]: string
    Customer[Name]: string
  rows:
  - [null, Bob]

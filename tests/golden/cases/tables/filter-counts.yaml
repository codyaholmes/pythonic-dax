id: filter-counts
description: >-
  FILTER with RELATED, with a measure (context transition per row), ALL(Product) including the blank row
  (it has the unmatched sales), a FILTER table as a CALCULATE filter (filters Sales through Customer),
  and IN with a one-column table.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  result = model.evaluate(ROW(
      "RedSales", COUNTROWS(FILTER(Sales, RELATED(Product["Color"]) == "Red")),
      "ProductsWithSales", COUNTROWS(FILTER(ALL(Product), total > 0)),
      "RealProductsWithSales", COUNTROWS(FILTER(Product, total > 0)),
      "BigAmounts", COUNTROWS(FILTER(Sales, Sales["Amount"] > 6)),
      "ByFilterTable", CALCULATE(total, FILTER(Customer, Customer["Name"] != "Bob")),
      "InTable", CALCULATE(total, Sales["ProductKey"].IN(VALUES(Product["ProductKey"]))),
  ))
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
  EVALUATE
      ROW("RedSales", COUNTROWS(FILTER(Sales, RELATED(Product[Color]) = "Red")), "ProductsWithSales", COUNTROWS(FILTER(ALL(Product), [Total] > 0)), "RealProductsWithSales", COUNTROWS(FILTER(Product, [Total] > 0)), "BigAmounts", COUNTROWS(FILTER(Sales, Sales[Amount] > 6)), "ByFilterTable", CALCULATE([Total], FILTER(Customer, Customer[Name] <> "Bob")), "InTable", CALCULATE([Total], Sales[ProductKey] IN VALUES(Product[ProductKey])))
expected:
  ordered: false
  columns:
    '[RedSales]': integer
    '[ProductsWithSales]': integer
    '[RealProductsWithSales]': integer
    '[BigAmounts]': integer
    '[ByFilterTable]': decimal
    '[InTable]': decimal
  rows:
  - [2, 3, 2, 3, 18.25, 23.75]

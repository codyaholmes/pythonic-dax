id: earlier-and-transition
description: >-
  EARLIER reads the outer row context in a calculated column (a running total). Context transition inside
  SUMX over Sales filters Sales' expanded table, so each sale also filters its Product and Customer rows;
  unmatched sales only reach the blank row, which COUNTROWS(Product) doesn't count.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  S = Sales
  model.add_column(S, "Running", SUMX(FILTER(S, S["SaleID"] <= EARLIER(S["SaleID"])), S["Amount"]))
  result = model.evaluate(SUMMARIZECOLUMNS(S["SaleID"], S["Running"], {
      "Rows": COUNTROWS(S),
      "Products": SUMX(S, CALCULATE(COUNTROWS(Product))),
      "Customers": SUMX(S, CALCULATE(COUNTROWS(Customer))),
  }))
dax: |
  DEFINE
      COLUMN Sales[Running] = SUMX(FILTER(Sales, Sales[SaleID] <= EARLIER(Sales[SaleID])), Sales[Amount])
  EVALUATE
      SUMMARIZECOLUMNS(Sales[SaleID], Sales[Running], "Rows", COUNTROWS(Sales), "Products", SUMX(Sales, CALCULATE(COUNTROWS(Product))), "Customers", SUMX(Sales, CALCULATE(COUNTROWS(Customer))))
expected:
  ordered: false
  columns:
    Sales[SaleID]: integer
    Sales[Running]: decimal
    '[Rows]': integer
    '[Products]': integer
    '[Customers]': integer
  rows:
  - [1, 10, 1, 1, 1]
  - [2, 15.5, 1, 1, 1]
  - [3, 22.75, 1, 1, 1]
  - [4, 122.75, 1, null, 1]
  - [5, 123.75, 1, null, 1]

id: rankx
description: >-
  RANKX ranks the current customer's total among all customers. DESC and SKIP by default; BLANK ranks
  last in DESC order and first in ASC order. The third argument ranks a fixed value (50) instead of the
  current total. Ranking over ALL(Customer) works because context transition on a Customer row replaces
  the filter on Name.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  N = Customer["Name"]
  result = model.evaluate(SUMMARIZECOLUMNS(N, {
      "Total": total,
      "Rank": RANKX(ALL(N), total),
      "RankAsc": RANKX(ALL(N), total, order=ASC),
      "Dense": RANKX(ALL(Customer), total, ties=DENSE),
      "OfFifty": RANKX(ALL(N), total, 50),
  }))
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
  EVALUATE
      SUMMARIZECOLUMNS(Customer[Name], "Total", [Total], "Rank", RANKX(ALL(Customer[Name]), [Total]), "RankAsc", RANKX(ALL(Customer[Name]), [Total], , ASC), "Dense", RANKX(ALL(Customer), [Total], , , DENSE), "OfFifty", RANKX(ALL(Customer[Name]), [Total], 50))
expected:
  ordered: false
  columns:
    Customer[Name]: string
    '[Total]': decimal
    '[Rank]': integer
    '[RankAsc]': integer
    '[Dense]': integer
    '[OfFifty]': integer
  rows:
  - [Ann, 17.25, 2, 3, 2, 2]
  - [Bob, 105.5, 1, 4, 1, 2]
  - [Cy, 1, 3, 2, 3, 2]
  - [Dee, null, 4, 1, 4, 2]

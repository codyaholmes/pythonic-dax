id: table-filters
description: >-
  Tables as CALCULATE filters. A table reference has no blank row, so filtering by Product drops the unmatched
  sales, while VALUES(Product) keeps them. Filtering by Sales filters Product too (its expanded table),
  and an unmatched sale only reaches the blank row, which COUNTROWS(Product) doesn't count.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  C = Product["Color"]
  result = model.evaluate(SUMMARIZECOLUMNS(C, {
      "Total": total,
      "ByProductRows": CALCULATE(total, Product),
      "ByProductValues": CALCULATE(total, VALUES(Product)),
      "ByColorValues": CALCULATE(total, VALUES(C)),
      "ProductsBySales": CALCULATE(COUNTROWS(Product), Sales),
      "ProductsByAllSales": CALCULATE(COUNTROWS(Product), CALCULATETABLE(Sales, REMOVEFILTERS())),
      "RedByTable": CALCULATE(total, CALCULATETABLE(VALUES(C), C == "Red")),
      "KeepValues": CALCULATE(total, KEEPFILTERS(CALCULATETABLE(VALUES(C), ALL(C)))),
  }))
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
  EVALUATE
      SUMMARIZECOLUMNS(Product[Color], "Total", [Total], "ByProductRows", CALCULATE([Total], Product), "ByProductValues", CALCULATE([Total], VALUES(Product)), "ByColorValues", CALCULATE([Total], VALUES(Product[Color])), "ProductsBySales", CALCULATE(COUNTROWS(Product), Sales), "ProductsByAllSales", CALCULATE(COUNTROWS(Product), CALCULATETABLE(Sales, REMOVEFILTERS())), "RedByTable", CALCULATE([Total], CALCULATETABLE(VALUES(Product[Color]), Product[Color] = "Red")), "KeepValues", CALCULATE([Total], KEEPFILTERS(CALCULATETABLE(VALUES(Product[Color]), ALL(Product[Color])))))
expected:
  ordered: false
  columns:
    Product[Color]: string
    '[Total]': decimal
    '[ByProductRows]': decimal
    '[ByProductValues]': decimal
    '[ByColorValues]': decimal
    '[ProductsBySales]': integer
    '[ProductsByAllSales]': integer
    '[RedByTable]': decimal
    '[KeepValues]': decimal
  rows:
  - [null, 101, null, 101, 101, null, 2, 15.5, 101]
  - [Red, 15.5, 15.5, 15.5, 15.5, 1, 2, 15.5, 15.5]
  - [Green, 7.25, 7.25, 7.25, 7.25, 1, 2, 15.5, 7.25]
  - [Blue, null, null, null, null, null, 2, 15.5, null]

id: userelationship
description: >-
  USERELATIONSHIP uses the inactive ship-day relationship instead of the order-day one. CROSSFILTER(...,
  NONE) stops the active relationship from filtering.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Calendar:
      columns:
        Day: integer
        Week: string
      rows:
      - [1, W1]
      - [2, W1]
      - [3, W2]
      - [4, W2]
    Orders:
      columns:
        OrderID: integer
        OrderDay: integer
        ShipDay: integer
        Units: integer
      rows:
      - [1, 1, 2, 10]
      - [2, 1, 3, 20]
      - [3, 3, 4, 30]
      - [4, 4, 4, 40]
  relationships:
  - from: Orders[OrderDay]
    to: Calendar[Day]
  - from: Orders[ShipDay]
    to: Calendar[Day]
    active: false
python: |
  units = model.add_measure("Total Units", SUM(Orders["Units"]), table="Orders")
  D = Calendar["Day"]
  result = model.evaluate(SUMMARIZECOLUMNS(D, {
      "ByOrder": units,
      "ByShip": CALCULATE(units, USERELATIONSHIP(Orders["ShipDay"], D)),
      "ShipWeekOnly": CALCULATE(units, USERELATIONSHIP(Orders["ShipDay"], D), ALL(D), Calendar["Week"] == "W2"),
      "NoFilter": CALCULATE(units, CROSSFILTER(Orders["OrderDay"], D, "NONE")),
  }))
dax: |
  DEFINE
      MEASURE Orders[Total Units] = SUM(Orders[Units])
  EVALUATE
      SUMMARIZECOLUMNS('Calendar'[Day], "ByOrder", [Total Units], "ByShip", CALCULATE([Total Units], USERELATIONSHIP(Orders[ShipDay], 'Calendar'[Day])), "ShipWeekOnly", CALCULATE([Total Units], USERELATIONSHIP(Orders[ShipDay], 'Calendar'[Day]), ALL('Calendar'[Day]), 'Calendar'[Week] = "W2"), "NoFilter", CALCULATE([Total Units], CROSSFILTER(Orders[OrderDay], 'Calendar'[Day], NONE)))
expected:
  ordered: false
  columns:
    Calendar[Day]: integer
    '[ByOrder]': integer
    '[ByShip]': integer
    '[ShipWeekOnly]': integer
    '[NoFilter]': integer
  rows:
  - [1, 30, null, 90, 100]
  - [3, 30, 20, 90, 100]
  - [4, 40, 70, 90, 100]
  - [2, null, 10, 90, 100]

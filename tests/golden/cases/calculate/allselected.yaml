id: allselected
description: >-
  ALLSELECTED inside SUMMARIZECOLUMNS restores the filters from outside it (here CALCULATETABLE's colors),
  not all colors.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  C = Product["Color"]
  result = model.evaluate(CALCULATETABLE(
      SUMMARIZECOLUMNS(C, {
          "Total": total,
          "Selected": CALCULATE(total, ALLSELECTED()),
          "SelectedColor": CALCULATE(total, ALLSELECTED(C)),
          "SelectedProduct": CALCULATE(total, ALLSELECTED(Product)),
          "AllColors": CALCULATE(total, ALL(C)),
      }),
      C.IN(["Red", "Green"]),
  ))
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
  EVALUATE
      CALCULATETABLE(SUMMARIZECOLUMNS(Product[Color], "Total", [Total], "Selected", CALCULATE([Total], ALLSELECTED()), "SelectedColor", CALCULATE([Total], ALLSELECTED(Product[Color])), "SelectedProduct", CALCULATE([Total], ALLSELECTED(Product)), "AllColors", CALCULATE([Total], ALL(Product[Color]))), Product[Color] IN {"Red", "Green"})
expected:
  ordered: false
  columns:
    Product[Color]: string
    '[Total]': decimal
    '[Selected]': decimal
    '[SelectedColor]': decimal
    '[SelectedProduct]': decimal
    '[AllColors]': decimal
  rows:
  - [Red, 15.5, 22.75, 22.75, 22.75, 123.75]
  - [Green, 7.25, 22.75, 22.75, 22.75, 123.75]

id: boolean-filters
description: >-
  True/False filters in CALCULATE replace the filter on their column with every value that passes, including
  the blank row's BLANK (so <> "Red" also keeps the unmatched sales). Two filters on one column intersect,
  and KEEPFILTERS intersects with the color being grouped.
source: powerbi
reference: Power BI Desktop, query tool, made-up test data
powerbi_version: Analysis Services engine 17.0.93.23
model:
  tables:
    Product:
      columns:
        ProductKey: integer
        Color: string
      rows:
      - [1, Red]
      - [2, Green]
      - [3, Blue]
      - [4, null]
    Customer:
      columns:
        CustomerKey: integer
        Name: string
      rows:
      - [1, Ann]
      - [2, Bob]
      - [3, Cy]
      - [4, Dee]
    Sales:
      columns:
        SaleID: integer
        ProductKey: integer
        CustomerKey: integer
        Amount: decimal
        Qty: integer
        Note: string
      rows:
      - [1, 1, 1, 10.0, 1, a]
      - [2, 1, 2, 5.5, 2, x]
      - [3, 2, 1, 7.25, null, null]
      - [4, 9, 2, 100.0, 4, b]
      - [5, null, 3, 1.0, 1, c]
  relationships:
  - from: Sales[ProductKey]
    to: Product[ProductKey]
  - from: Sales[CustomerKey]
    to: Customer[CustomerKey]
    cross_filter: both
python: |
  total = model.add_measure("Total", SUM(Sales["Amount"]), table="Sales")
  C = Product["Color"]
  result = model.evaluate(SUMMARIZECOLUMNS(C, {
      "Total": total,
      "Red": CALCULATE(total, C == "Red"),
      "NotRed": CALCULATE(total, C != "Red"),
      "BlankColor": CALCULATE(total, C == BLANK()),
      "StrictBlank": CALCULATE(total, C.strict_eq(BLANK())),
      "RedOrBlank": CALCULATE(total, C.IN(["Red", BLANK()])),
      "TwoFilters": CALCULATE(total, C == "Red", C == "Green"),
      "KeepRed": CALCULATE(total, KEEPFILTERS(C == "Red")),
      "BigSales": CALCULATE(total, Sales["Amount"] > 6),
      "KeyAndColor": CALCULATE(total, (Product["ProductKey"] <= 2) & (C != "Green")),
  }))
dax: |
  DEFINE
      MEASURE Sales[Total] = SUM(Sales[Amount])
  EVALUATE
      SUMMARIZECOLUMNS(Product[Color], "Total", [Total], "Red", CALCULATE([Total], Product[Color] = "Red"), "NotRed", CALCULATE([Total], Product[Color] <> "Red"), "BlankColor", CALCULATE([Total], Product[Color] = BLANK()), "StrictBlank", CALCULATE([Total], Product[Color] == BLANK()), "RedOrBlank", CALCULATE([Total], Product[Color] IN {"Red", BLANK()}), "TwoFilters", CALCULATE([Total], Product[Color] = "Red", Product[Color] = "Green"), "KeepRed", CALCULATE([Total], KEEPFILTERS(Product[Color] = "Red")), "BigSales", CALCULATE([Total], Sales[Amount] > 6), "KeyAndColor", CALCULATE([Total], Product[ProductKey] <= 2 && Product[Color] <> "Green"))
expected:
  ordered: false
  columns:
    Product[Color]: string
    '[Total]': decimal
    '[Red]': decimal
    '[NotRed]': decimal
    '[BlankColor]': decimal
    '[StrictBlank]': decimal
    '[RedOrBlank]': decimal
    '[TwoFilters]': decimal
    '[KeepRed]': decimal
    '[BigSales]': decimal
    '[KeyAndColor]': decimal
  rows:
  - [null, 101, 15.5, 108.25, 101, 101, 116.5, null, null, 100, 116.5]
  - [Red, 15.5, 15.5, 108.25, 101, 101, 116.5, null, 15.5, 10, 116.5]
  - [Green, 7.25, 15.5, 108.25, 101, 101, 116.5, null, null, 7.25, 116.5]
  - [Blue, null, 15.5, 108.25, 101, 101, 116.5, null, null, null, 116.5]
